name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    # setup-ruby has no Ruby 3.3.6 build for ubuntu-26.04.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3.6'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the specs
        run: bundle exec rake spec
      - name: Run the standard
        run: bundle exec rake standard
